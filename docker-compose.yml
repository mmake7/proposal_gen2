services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proposal-gen
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
